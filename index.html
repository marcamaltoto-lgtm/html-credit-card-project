<!DOCTYPE html>
<!--Mon Projet de Carte bancaire(sans animation)-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <span class="logo">
                <img src="logo.png" alt="" />
                <h5>Master Card</h5>
            </span>
            <img src="chip.png" alt="" class="chip" />
        </header>

        <div class="card-details">
            <div class="name-number">
                <h6>Card Number</h6>
                <h5 class="number">40455 45 2434 54543</h5>
                <h5 class="name">Marc Toto</h5>
            </div>
            <div class="valid-date">
                <h6>Valid Thru</h6>
                <h5>24/30</h5>
            </div>
        </div>
    </div>
</body>
</html>
