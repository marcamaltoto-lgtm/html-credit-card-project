<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Credit Card</title>
    <link rel="stylesheet" href="style2.css" />
</head>
<body>
    <div class="container">
        <header>
            <span class="logo">
            <img src="logo.png" alt="">
            <h6>Master Card</h6>
            </span>
            <img src="chip.png" alt="" class="chip">
        </header>

        <div class="card-details">
            <div class="name-number">
                <h6>Card Number</h6>
                <h5 class="number">34453 24524 32434</h5>
                <h5 class="name">Marc Toto</h5>
            </div>
            <div class="valid-date">
                <h6>Valid Thru</h6>
                <h5>6/40</h5>
            </div>
        </div>
    </div>
</body>
</html>
